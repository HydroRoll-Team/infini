[project]
name = "infini"
version = "3.0.1"
description = "Infini 内容输入输出流框架"
authors = [
    { name = "简律纯", email = "leader@hydroroll.team" },
]
dependencies = [
    "rich>=13.7.0",
    "jinja2>=3.1.3",
]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.urls]
Homepage = "https://infini.hydroroll.team"
Documentation = "https://infini.hydroroll.team"
Repository = "https://github.com/HydroRoll-Team/infini"
Changelog = "https://infini.hydroroll.team/zh_CN/latest/changelog.html"

[build-system]
requires = ["hataich"]
build-backend = "hataich"

[dependency-groups]
dev = [
    "ipdm>=0.1.4",
    "pytest>=8.4.1",
]
docs = [
    "furo>=2025.7.19",
    "myst-parser>=4.0.1",
    "sphinx>=8.1.3",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-design>=0.6.1",
    "sphinx-intl>=2.3.1",
]
